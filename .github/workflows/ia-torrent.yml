name: ia-torrent
on:
  workflow_dispatch:
    inputs:
      file_indices:
        description: 'torrent file indices (0-based, comma-separated e.g. 0,1,2,3,4 or range 0-49)'
        required: true
        default: '0-4'
jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: install tools
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq aria2 > /dev/null
          pip install internetarchive requests -q

      - name: download and upload torrent files
        shell: python
        run: |
          import requests, re, os, secrets as _sec, subprocess, glob, time, json
          from internetarchive import upload, get_session

          IA_ACCESS = "${{ secrets.IA_ACCESS_KEY }}"
          IA_SECRET = "${{ secrets.IA_SECRET_KEY }}"
          assert IA_ACCESS and IA_SECRET, "IA keys missing"
          s = get_session(config={"s3": {"access": IA_ACCESS, "secret": IA_SECRET}})

          MAGNET = "magnet:?xt=urn:btih:169257f30c3fbee583cc3605e9653549a59a9523&dn=ALIEN_TXTBASE&tr=udp://tracker.openbittorrent.com:80&tr=udp://tracker.opentrackr.org:1337/announce"

          fi_str = "${{ github.event.inputs.file_indices }}"
          if '-' in fi_str:
              start, end = fi_str.split('-')
              indices = list(range(int(start), int(end) + 1))
          else:
              indices = [int(x) for x in fi_str.split(',') if x.strip()]

          dl_dir = "/tmp/torrent"
          os.makedirs(dl_dir, exist_ok=True)

          # Use aria2c to get torrent metadata first
          print("Fetching torrent metadata...", flush=True)
          meta_cmd = [
              "aria2c", "--enable-dht=true", "--bt-enable-lpd=true",
              "--bt-tracker=udp://tracker.openbittorrent.com:80,udp://tracker.opentrackr.org:1337/announce,udp://explodie.org:6969,udp://tracker.torrent.eu.org:451",
              "--dir", dl_dir, "--seed-time=0", "--bt-stop-timeout=60",
              "--summary-interval=0", "--console-log-level=warn",
              "--follow-torrent=true", "--check-integrity=false",
              MAGNET
          ]
          proc = subprocess.Popen(meta_cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

          # Wait for metadata
          time.sleep(45)
          proc.terminate()

          # Find .torrent file or metadata
          torrent_files = glob.glob(os.path.join(dl_dir, "*.torrent"))
          print(f"Torrent files found: {len(torrent_files)}", flush=True)

          # Get file list from aria2c
          if torrent_files:
              # Use show-files to list contents
              show_cmd = ["aria2c", "--show-files=true", torrent_files[0]]
              result = subprocess.run(show_cmd, capture_output=True, text=True, timeout=30)
              print(f"File list:\n{result.stdout[:2000]}", flush=True)
              print(f"Stderr:\n{result.stderr[:1000]}", flush=True)

          # Build select string for aria2c (1-based index)
          select_str = ",".join(str(i + 1) for i in indices)
          print(f"Selecting files: {select_str}", flush=True)

          # Now download selected files
          dl_cmd = [
              "aria2c", "--enable-dht=true", "--bt-enable-lpd=true",
              "--bt-tracker=udp://tracker.openbittorrent.com:80,udp://tracker.opentrackr.org:1337/announce,udp://explodie.org:6969,udp://tracker.torrent.eu.org:451",
              "--dir", dl_dir, "--seed-time=0",
              "--bt-stop-timeout=300",
              "--select-file=" + select_str,
              "--follow-torrent=true", "--check-integrity=false",
              "--max-overall-upload-limit=100K", "--summary-interval=10",
              "--console-log-level=notice",
              MAGNET
          ]
          print(f"Starting aria2c download...", flush=True)
          proc = subprocess.Popen(dl_cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

          # Wait and monitor
          max_wait = 600
          elapsed = 0
          while elapsed < max_wait:
              time.sleep(15)
              elapsed += 15
              all_files = glob.glob(os.path.join(dl_dir, "**", "*.txt"), recursive=True) + \
                         glob.glob(os.path.join(dl_dir, "**", "*.rar"), recursive=True) + \
                         glob.glob(os.path.join(dl_dir, "**", "*.7z"), recursive=True)
              all_files = [f for f in all_files if os.path.getsize(f) > 1024]
              if all_files:
                  print(f"Found {len(all_files)} files after {elapsed}s", flush=True)
                  for f in all_files[:5]:
                      print(f"  {os.path.basename(f)}: {os.path.getsize(f)} bytes", flush=True)
                  if len(all_files) >= len(indices):
                      break
              if elapsed % 60 == 0:
                  print(f"Still downloading... {elapsed}s", flush=True)

          proc.terminate()

          # Find all completed files
          all_files = sorted(glob.glob(os.path.join(dl_dir, "**", "*"), recursive=True))
          data_files = [f for f in all_files if os.path.isfile(f) and not f.endswith('.torrent') and os.path.getsize(f) > 1024]

          print(f"\nFound {len(data_files)} completed files", flush=True)

          results = []
          for idx, fpath in enumerate(data_files):
              fname = os.path.basename(fpath)
              fsize = os.path.getsize(fpath)
              print(f"\n=== FILE {idx}: {fname} ({fsize}B) ===", flush=True)

              ident = _sec.token_hex(8)
              try:
                  up = upload(ident, [fpath],
                      metadata={"mediatype": "data", "collection": "opensource_media",
                                "title": _sec.token_hex(4), "subject": "a"},
                      access_key=IA_ACCESS, secret_key=IA_SECRET, verbose=True)
                  ok = all(getattr(x, "status_code", 0) == 200 for x in up)
              except Exception as e:
                  print(f"IA ERROR: {e}", flush=True)
                  ok = False

              url = f"https://archive.org/details/{ident}"
              print(f"FILE {idx} IA: {'OK' if ok else 'CHECK'} -> {url}", flush=True)
              results.append(f"{idx}|{fname}|{'IA_OK' if ok else 'IA_CHECK'}|{url}")
              os.remove(fpath)

          print("\n=== ALL RESULTS ===", flush=True)
          for r in results:
              print(r, flush=True)
          with open("links.txt", "w") as fh:
              fh.write("\n".join(results))

      - name: upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-torrent-${{ github.run_id }}
          path: links.txt
          retention-days: 90
          if-no-files-found: ignore
