name: ia-torrent
on:
  workflow_dispatch:
    inputs:
      file_indices:
        description: 'torrent file indices (0-based, comma-separated e.g. 0,1,2,3,4 or range 0-49)'
        required: true
        default: '0-4'
      method:
        description: 'download method: webtorrent, seedbox, or aria2c'
        required: true
        default: 'aria2c'
jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: install tools
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq aria2 > /dev/null
          npm install -g webtorrent-cli 2>/dev/null || true
          pip install internetarchive requests -q

      - name: download and upload torrent files
        shell: python
        run: |
          import requests, re, os, secrets as _sec, subprocess, glob, time, json
          from internetarchive import upload, get_session

          IA_ACCESS = "${{ secrets.IA_ACCESS_KEY }}"
          IA_SECRET = "${{ secrets.IA_SECRET_KEY }}"
          assert IA_ACCESS and IA_SECRET, "IA keys missing"
          s = get_session(config={"s3": {"access": IA_ACCESS, "secret": IA_SECRET}})

          MAGNET = "magnet:?xt=urn:btih:169257f30c3fbee583cc3605e9653549a59a9523&dn=ALIEN_TXTBASE&tr=udp://tracker.openbittorrent.com:80&tr=udp://tracker.opentrackr.org:1337/announce"

          METHOD = "${{ github.event.inputs.method }}"
          fi_str = "${{ github.event.inputs.file_indices }}"
          if '-' in fi_str:
              start, end = fi_str.split('-')
              indices = list(range(int(start), int(end) + 1))
          else:
              indices = [int(x) for x in fi_str.split(',') if x.strip()]

          dl_dir = "/tmp/torrent"
          os.makedirs(dl_dir, exist_ok=True)

          # METHOD 1: WebTorrent (uses WebRTC/WebSocket, may bypass BT blocks)
          if METHOD == "webtorrent":
              print("=== METHOD: WebTorrent ===", flush=True)
              # WebTorrent can't select files, download all then pick
              cmd = ["webtorrent", "download", MAGNET, "--path", dl_dir, "--timeout", "120"]
              print(f"Starting webtorrent...", flush=True)
              proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              elapsed = 0
              while elapsed < 600:
                  time.sleep(15)
                  elapsed += 15
                  files = glob.glob(os.path.join(dl_dir, "**", "*"), recursive=True)
                  data = [f for f in files if os.path.isfile(f) and os.path.getsize(f) > 1024]
                  if data:
                      print(f"Found {len(data)} files after {elapsed}s", flush=True)
                      for f in data[:3]:
                          print(f"  {os.path.basename(f)}: {os.path.getsize(f)}", flush=True)
                      break
                  if elapsed % 60 == 0:
                      print(f"Waiting... {elapsed}s", flush=True)
              proc.terminate()

          # METHOD 2: Seedbox via seedr.cc free API
          elif METHOD == "seedbox":
              print("=== METHOD: Seedbox (seedr.cc) ===", flush=True)
              # Create seedr account
              seedr_session = requests.Session()
              # Register
              reg = seedr_session.post("https://seedr.cc/api/user/register", 
                  data={"email": f"{_sec.token_hex(8)}@tempmail.io", 
                        "username": _sec.token_hex(8),
                        "password": "Temp12345678!"},
                  timeout=15)
              print(f"Register: {reg.status_code} {reg.text[:200]}", flush=True)
              
              if reg.status_code == 200:
                  reg_data = reg.json()
                  token = reg_data.get("access_token", "")
                  if token:
                      seedr_session.headers["Authorization"] = f"Bearer {token}"
                      # Add torrent
                      add_resp = seedr_session.post("https://seedr.cc/api/torrent/add",
                          data={"magnet": MAGNET}, timeout=30)
                      print(f"Add torrent: {add_resp.status_code} {add_resp.text[:200]}", flush=True)
                      
                      # Wait for download
                      time.sleep(60)
                      # List files
                      files_resp = seedr_session.get("https://seedr.cc/api/folder/0", timeout=15)
                      print(f"Files: {files_resp.text[:500]}", flush=True)

          # METHOD 3: aria2c with HTTP-only trackers + DHT
          else:
              print("=== METHOD: aria2c (HTTP trackers + DHT) ===", flush=True)
              # Try with HTTP trackers only, no UDP
              http_trackers = [
                  "http://tracker.openbittorrent.com:80/announce",
                  "http://tracker.opentrackr.org:1337/announce",
                  "http://tracker.torrent.eu.org:451/announce",
                  "http://tracker.tiny-vps.com:6969/announce",
                  "http://open.stealth.si:80/announce",
                  "http://tracker.pirateparty.gr:6969/announce",
                  "http://9.rarbg.to:2810/announce",
                  "http://p4p.arenabg.com:1337/announce",
                  "http://tracker.cyberia.is:6969/announce",
              ]
              tracker_str = ",".join(http_trackers)

              # Phase 1: Get metadata only (fast, small)
              print("Phase 1: Getting torrent metadata...", flush=True)
              meta_cmd = [
                  "aria2c", "--enable-dht=true", "--bt-enable-lpd=true",
                  f"--bt-tracker={tracker_str}",
                  "--dir", dl_dir, "--seed-time=0",
                  "--bt-stop-timeout=120",
                  "--summary-interval=0", "--console-log-level=warn",
                  "--follow-torrent=mem", "--check-integrity=false",
                  "--bt-metadata-only=true",
                  "--dht-file-path=/tmp/dht.dat",
                  MAGNET
              ]
              proc = subprocess.Popen(meta_cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              proc.wait(timeout=180)
              
              # Find the .torrent metadata file
              meta_files = glob.glob(os.path.join(dl_dir, "*.torrent")) + \
                          glob.glob(os.path.join(dl_dir, "*.metalink"))
              print(f"Metadata files: {len(meta_files)}", flush=True)
              for mf in meta_files:
                  print(f"  {mf} ({os.path.getsize(mf)} bytes)", flush=True)

              # Phase 2: Download specific files using the metadata
              if meta_files:
                  print("\nPhase 2: Downloading selected files...", flush=True)
                  select_str = ",".join(str(i + 1) for i in indices)
                  dl_cmd = [
                      "aria2c", "--enable-dht=true", "--bt-enable-lpd=true",
                      f"--bt-tracker={tracker_str}",
                      "--dir", dl_dir, "--seed-time=0",
                      "--bt-stop-timeout=600",
                      f"--select-file={select_str}",
                      "--follow-torrent=mem", "--check-integrity=false",
                      "--max-overall-upload-limit=100K",
                      "--summary-interval=10", "--console-log-level=notice",
                      "--dht-file-path=/tmp/dht.dat",
                      meta_files[0]
                  ]
                  proc = subprocess.Popen(dl_cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              else:
                  # Fallback: direct magnet with aria2c
                  print("\nNo metadata file, trying direct magnet...", flush=True)
                  select_str = ",".join(str(i + 1) for i in indices)
                  dl_cmd = [
                      "aria2c", "--enable-dht=true", "--bt-enable-lpd=true",
                      f"--bt-tracker={tracker_str}",
                      "--dir", dl_dir, "--seed-time=0",
                      "--bt-stop-timeout=600",
                      f"--select-file={select_str}",
                      "--follow-torrent=mem", "--check-integrity=false",
                      "--max-overall-upload-limit=100K",
                      "--summary-interval=10", "--console-log-level=notice",
                      "--dht-file-path=/tmp/dht.dat",
                      MAGNET
                  ]
                  proc = subprocess.Popen(dl_cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

              # Monitor download
              elapsed = 0
              max_wait = 600
              while elapsed < max_wait:
                  time.sleep(15)
                  elapsed += 15
                  files = glob.glob(os.path.join(dl_dir, "**", "*.txt"), recursive=True) + \
                         glob.glob(os.path.join(dl_dir, "**", "*.rar"), recursive=True) + \
                         glob.glob(os.path.join(dl_dir, "**", "*.7z"), recursive=True) + \
                         glob.glob(os.path.join(dl_dir, "**", "*.zip"), recursive=True)
                  files = [f for f in files if os.path.getsize(f) > 1024]
                  if files:
                      print(f"Found {len(files)} files after {elapsed}s", flush=True)
                      for f in files[:5]:
                          print(f"  {os.path.basename(f)}: {os.path.getsize(f)}", flush=True)
                  if elapsed % 60 == 0:
                      print(f"Downloading... {elapsed}s", flush=True)
              proc.terminate()

          # Find all completed files
          all_files = sorted(glob.glob(os.path.join(dl_dir, "**", "*"), recursive=True))
          data_files = [f for f in all_files if os.path.isfile(f) 
                       and not f.endswith('.torrent') 
                       and not f.endswith('.metalink')
                       and not f.endswith('.aria2')
                       and os.path.getsize(f) > 1024]
          
          # Filter to selected indices if we have enough files
          if len(data_files) > len(indices):
              data_files = [data_files[i] for i in indices if i < len(data_files)]

          print(f"\nFound {len(data_files)} completed files", flush=True)

          results = []
          for idx, fpath in enumerate(data_files):
              fname = os.path.basename(fpath)
              fsize = os.path.getsize(fpath)
              print(f"\n=== FILE {idx}: {fname} ({fsize}B) ===", flush=True)

              ident = _sec.token_hex(8)
              try:
                  up = upload(ident, [fpath],
                      metadata={"mediatype": "data", "collection": "opensource_media",
                                "title": _sec.token_hex(4), "subject": "a"},
                      access_key=IA_ACCESS, secret_key=IA_SECRET, verbose=True)
                  ok = all(getattr(x, "status_code", 0) == 200 for x in up)
              except Exception as e:
                  print(f"IA ERROR: {e}", flush=True)
                  ok = False

              url = f"https://archive.org/details/{ident}"
              print(f"FILE {idx} IA: {'OK' if ok else 'CHECK'} -> {url}", flush=True)
              results.append(f"{idx}|{fname}|{'IA_OK' if ok else 'IA_CHECK'}|{url}")
              os.remove(fpath)

          print("\n=== ALL RESULTS ===", flush=True)
          for r in results:
              print(r, flush=True)
          with open("links.txt", "w") as fh:
              fh.write("\n".join(results))

      - name: upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-torrent-${{ github.run_id }}
          path: links.txt
          retention-days: 90
          if-no-files-found: ignore
