name: relay
on:
  workflow_dispatch:
    inputs:
      file_index:
        description: torrent file index (1-31)
        required: true
        default: '25'
jobs:
  download-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: fetch metadata
        run: |
          sudo apt-get install -y aria2 curl jq > /dev/null
          mkdir -p meta
          timeout 300 aria2c --bt-metadata-only=true --bt-save-metadata=true --seed-time=0 --enable-dht=true --bt-tracker="udp://tracker.opentrackr.org:1337/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://open.tracker.cl:1337/announce" 'magnet:?xt=urn:btih:169257f30c3fbee583cc3605e9653549a59a9523&dn=ALIEN_TXTBASE' -d meta
          ls -la meta/
      - name: download part
        run: |
          IDX=${{ github.event.inputs.file_index }}
          TORRENT=meta/169257f30c3fbee583cc3605e9653549a59a9523.torrent
          aria2c --select-file=$IDX --bt-remove-unselected-file=true --seed-time=0 --file-allocation=none --enable-dht=true --summary-interval=60 --bt-tracker="udp://tracker.opentrackr.org:1337/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://open.tracker.cl:1337/announce" "$TORRENT" -d out
          ls -la out/ALIEN_TXTBASE/
      - name: upload to gofile
        run: |
          FPATH=$(find out -name '*.rar' | head -1)
          echo "uploading: $FPATH"
          SRV=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "server: $SRV"
          RESP=$(curl -s -F "file=@$FPATH" "https://$SRV.gofile.io/contents/uploadfile" --max-time 7200)
          echo "$RESP" > resp.json
          cat resp.json
      - name: output link
        run: |
          LINK=$(jq -r '.data.downloadPage' resp.json)
          echo "DOWNLOAD_PAGE: $LINK"