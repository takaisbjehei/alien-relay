name: mediafire-relay
on:
  workflow_dispatch:
    inputs:
      batch:
        description: pipe-separated file numbers (1-50)
        required: true
        default: '1|2|3|4|5'
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: install tools
        run: sudo apt-get install -y curl jq aria2 python3-requests > /dev/null

      - name: relay files
        shell: python
        run: |
          import requests, re, json, subprocess, os, time
          TOK = "p4Kvn54v1kLYLdNeROgaROi8jidLHm06"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131"
          batch = "${{ github.event.inputs.batch }}"
          nums = [int(x) for x in batch.split("|") if x.strip()]
          results = []
          for n in nums:
              print(f"===== FILE {n} =====", flush=True)
              r = requests.get(
                  "https://www.mediafire.com/api/1.5/folder/get_content.php",
                  params={"folder_key": "qvco18nox7703", "content_type": "files",
                          "response_format": "json", "chunk_size": 100},
                  headers={"User-Agent": UA}, timeout=30)
              files = r.json()["response"]["folder_content"]["files"]
              if n > len(files):
                  print(f"index {n} out of range"); continue
              f = files[n-1]
              name, size = f["filename"], int(f["size"])
              page = f["links"]["normal_download"]
              print(f"file: {name} ({size} bytes)", flush=True)
              rp = requests.get(page, headers={"User-Agent": UA}, timeout=30)
              m = re.search(r'(https://download\d+\.mediafire\.com/[^"\x27\s]+)', rp.text)
              if not m:
                  print(f"RESOLVE FAILED {name}"); results.append(f"{n}|{name}|RESOLVE_FAILED"); continue
              direct = m.group(1)
              print(f"direct ok: {direct[:60]}...", flush=True)
              r2 = requests.get(direct, headers={"User-Agent": UA}, stream=True, timeout=60)
              r2.raise_for_status()
              fname = name.replace("/", "_")
              with open(fname, "wb") as fh:
                  got = 0
                  for chunk in r2.iter_content(1024*1024):
                      fh.write(chunk); got += len(chunk)
                      if got % (500*1024*1024) < 1024*1024:
                          print(f"  {got/1024/1024:.0f}MB", flush=True)
              print(f"downloaded: {got} bytes", flush=True)
              if got != size:
                  print(f"SIZE MISMATCH: got {got} want {size}")
              # upload to gofile
              srv = requests.get("https://api.gofile.io/servers", timeout=15).json()["data"]["servers"][0]["name"]
              with open(fname, "rb") as fh:
                  up = requests.post(f"https://{srv}.gofile.io/contents/uploadfile",
                      headers={"Authorization": f"Bearer {TOK}"},
                      files={"file": (fname, fh)}, timeout=14400)
              ud = up.json()
              page2 = ud.get("data", {}).get("downloadPage", json.dumps(ud)[:200])
              print(f"FILE {n} GOFILE: {page2}", flush=True)
              results.append(f"{n}|{name}|{page2}")
              os.remove(fname)
          print("=== ALL RESULTS ===")
          for r in results: print(r, flush=True)
          with open("links.txt", "w") as fh:
              fh.write("\n".join(results))

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-relay-links-${{ github.run_id }}
          path: links.txt
          retention-days: 90
          if-no-files-found: ignore